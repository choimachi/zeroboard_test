name: ZEROBOARD Daily Research
on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 JST; GitHub may delay scheduled workflows.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zeroboard-daily-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'openai>=1.0,<3' 'supabase>=2.0,<3'
      - name: Run daily research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEARCH_MODEL: gpt-5-mini
          RESEARCH_USDJPY_ESTIMATE: '160'
          RESEARCH_INPUT_USD_PER_M: '1.00'
          RESEARCH_OUTPUT_USD_PER_M: '8.00'
        run: python research_agent.py
